<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    Sadhaka mark, v2.

    The first version used a dark app icon background, the default every
    icon generator reaches for. It did not actually look like this app.
    The real interface is warm paper with ink ruling and a serif hand, so
    the mark now uses those same surfaces: paper background, ink ruled
    lines, credit green for the one thing that is correct. Opening this
    icon should feel like opening the same ledger page the app shows.
  -->
  <rect width="100" height="100" rx="20" fill="#FBFAF6"/>
  <rect x="3" y="3" width="94" height="94" rx="17" fill="none" stroke="#17293D" stroke-width="2"/>

  <line x1="16" y1="34" x2="84" y2="34" stroke="#DDD6C8" stroke-width="2"/>
  <line x1="16" y1="50" x2="84" y2="50" stroke="#DDD6C8" stroke-width="2"/>
  <line x1="16" y1="66" x2="84" y2="66" stroke="#DDD6C8" stroke-width="2"/>

  <line x1="16" y1="50" x2="84" y2="50" stroke="#17293D" stroke-width="2.5" opacity="0.18"/>

  <path d="M 28 52 L 44 68 L 74 28"
        fill="none" stroke="#2C6A4E" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
